name: Daily SOV refresh

# Re-collects coverage, cleans it and commits the data files.
# Streamlit Cloud redeploys the dashboard on every push.
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
  workflow_dispatch:

concurrency:
  group: data-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser PyYAML vaderSentiment
      - run: python collect_data.py
      - run: python clean_data.py
      - run: python classify_coverage.py
      - name: Commit data
        run: |
          git config user.name "sov-bot"
          git config user.email "sov-bot@users.noreply.github.com"
          git add sov_data.json sov_data_clean.json sov_data_fy25_clean.json kra_classification.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh SOV data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
